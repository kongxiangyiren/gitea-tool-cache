name: 测试
on:
  # 手动
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  build-and-deploy:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download
        id: tool-cache
        uses: ./
        with:
          node-version: 18
      - name: node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.tool-cache.outputs.node-version }}
      - run: node -v
